<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Only Broker - DynamoDB Fast Bulk Uploader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <header class="bg-white shadow rounded-lg p-6 mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800">Only Broker - DynamoDB सुपरफास्ट अपलोडर</h1>
            <p class="text-gray-600 mt-2">ज़िप फ़ाइल अपलोड करें, ऑटो-पार्सिंग देखें और एक क्लिक में DynamoDB में सेव करें।</p>
        </header>

        <div class="bg-white shadow rounded-lg p-8 max-w-xl mx-auto mb-8">
            <form id="upload-form" class="space-y-6">
                <div>
                    <label class="block text-lg font-medium text-gray-700 mb-2">लिस्टिंग ज़िप फ़ाइल चुनें (.zip)</label>
                    <input type="file" id="zippfile" accept=".zip" required class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
                </div>
                <button type="submit" id="parse-btn" class="w-full bg-purple-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-purple-700 transition">फाइलों को स्कैन और पार्स करें</button>
            </form>
        </div>

        <div id="result-section" class="hidden bg-white shadow rounded-lg p-6">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h2 class="text-xl font-bold text-gray-800">स्कैन परिणाम (Scan Results)</h2>
                <span id="total-count" class="bg-purple-100 text-purple-800 text-lg font-bold px-4 py-1 rounded-full">कुल लिस्टिंग: 0</span>
            </div>
            
            <button onclick="uploadToDynamoDB()" id="upload-db-btn" class="w-full bg-green-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-700 transition shadow-lg mb-6 text-lg">DynamoDB डेटाबेस में सभी अपलोड करें</button>

            <div id="loading-spinner" class="hidden text-center py-4 text-purple-600 font-semibold">
                डेटाबेस में अपलोड हो रहा है... कृपया प्रतीक्षा करें ⏳
            </div>

            <div id="success-box" class="hidden bg-green-50 border border-green-200 rounded-lg p-4 mb-4 text-green-800 font-medium"></div>

            <div>
                <h3 class="font-bold text-gray-700 mb-2">अपलोड हुई प्रॉपर्टी आईडीज़ (Property IDs):</h3>
                <div id="ids-container" class="bg-gray-50 border rounded-lg p-4 max-h-60 overflow-y-auto text-xs font-mono text-gray-600 space-y-1">
                    <!-- IDs here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let parsedListings = [];

        document.getElementById('upload-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const fileInput = document.getElementById('zippfile');
            if(fileInput.files.length === 0) return;

            const formData = new FormData();
            formData.append('zippfile', fileInput.files[0]);

            const btn = document.getElementById('parse-btn');
            btn.textContent = 'स्कैन हो रहा है...';
            btn.disabled = true;

            try {
                const response = await fetch('/parse-zip', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                
                if(response.ok) {
                    parsedListings = result.listings;
                    document.getElementById('total-count').textContent = `कुल लिस्टिंग: ${result.total}`;
                    document.getElementById('result-section').classList.remove('hidden');
                    
                    // Show found IDs initially
                    const container = document.getElementById('ids-container');
                    container.innerHTML = '';
                    result.listings.forEach((item, idx) => {
                        container.innerHTML += `<div>#${idx+1}: ${item.property_id} (${item.filename})</div>`;
                    });
                } else {
                    alert('पार्सिंग असफल: ' + result.detail);
                }
            } catch(err) {
                alert('त्रुटि: ' + err.message);
            } finally {
                btn.textContent = 'फाइलों को स्कैन और पार्स करें';
                btn.disabled = false;
            }
        });

        async function uploadToDynamoDB() {
            const btn = document.getElementById('upload-db-btn');
            const spinner = document.getElementById('loading-spinner');
            const successBox = document.getElementById('success-box');
            
            btn.disabled = true;
            spinner.classList.remove('hidden');
            successBox.classList.add('hidden');

            try {
                const response = await fetch('/upload-dynamodb', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ listings: parsedListings })
                });

                const result = await response.json();
                if(response.ok) {
                    successBox.textContent = result.message;
                    successBox.classList.remove('hidden');

                    // Show successfully uploaded property IDs in exact lines
                    const container = document.getElementById('ids-container');
                    container.innerHTML = '<div class="text-green-600 font-bold mb-2">✓ DynamoDB में सफलतापूर्वक सेव हुई आईडीज़:</div>';
                    result.saved_ids.forEach((id, idx) => {
                        container.innerHTML += `<div class="text-green-700">✔ ${idx+1}. ${id}</div>`;
                    });
                } else {
                    alert('अपलोड असफल: ' + result.detail);
                }
            } catch(err) {
                alert('त्रुटि: ' + err.message);
            } finally {
                spinner.classList.add('hidden');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
