<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Only Broker - Payment Gateway Test</title>
    <!-- Razorpay Checkout script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background-color: #f4f7f6; }
        .card { background: white; padding: 40px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { background-color: #3399cc; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #2a7da8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Only Broker Test Payment</h2>
        <p>Click below to test Razorpay payment gateway.</p>
        <button id="pay-btn">Pay ₹500</button>
    </div>

    <script>
        document.getElementById('pay-btn').onclick = async function (e) {
            // 1. Backend से Order ID मंगवाएं
            const response = await fetch('/create-order', { method: 'POST' });
            const order = await response.json();

            if (order.error) {
                alert("Error creating order: " + order.error);
                return;
            }

            // 2. Razorpay Checkout Options सेट करें
            var options = {
                "key": "{{ key_id }}",
                "amount": order.amount,
                "currency": order.currency,
                "name": "Only Broker",
                "description": "Property Listing Test Payment",
                "order_id": order.id,
                "handler": function (response){
                    alert("Payment Successful! Payment ID: " + response.razorpay_payment_id);
                },
                "prefill": {
                    "name": "Hewantee Devi",
                    "email": "pawandevprasad@gmail.com",
                    "contact": "8131869049"
                },
                "theme": {
                    "color": "#3399cc"
                }
            };
            
            var rzp1 = new Razorpay(options);
            rzp1.open();
            e.preventDefault();
        }
    </script>
</body>
</html>
